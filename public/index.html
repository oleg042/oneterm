<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>oneterm</title>
<link rel="icon" id="favicon" href="data:,"/>
<link rel="stylesheet" href="/vendor/xterm.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* The terminal font is served from here, not Google Fonts. Google's JetBrains
   Mono is a LATIN SUBSET: it contains no Block Elements (U+2580-259F) and no
   Box Drawing (U+2500-257F), so every block in the Claude Code mascot, every
   rule and every progress bar was being drawn by the fallback font instead —
   two fonts with different metrics interleaved, which is what put seams through
   the artwork. This is the complete font, so all of that comes from ONE face. */
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;
  font-display:block;src:url('/fonts/JetBrainsMono-Regular.woff2') format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;
  font-display:block;src:url('/fonts/JetBrainsMono-Bold.woff2') format('woff2')}
</style>
<style>
/* ───────────────────────────────────────────────────────────────────────────
   Japandi: warm paper + sumi ink, one restrained vermillion (朱 shu), hairlines
   you feel rather than see. Space carries the structure borders used to.
   Density is untouched — minimalism serves the work, it doesn't thin it out.
   ─────────────────────────────────────────────────────────────────────────── */
:root{
  --paper:#F7F5F1; --rail:#F1EEE8; --raise:#EAE6DE; --sink:#FFFFFF;
  --ink:#1C1A17; --muted:#78736B; --faint:#A8A29A;
  --line:rgba(28,26,23,.08); --line2:rgba(28,26,23,.14);
  --accent:#C4551F; --accent-soft:rgba(196,85,31,.09);
  --ok:#5B7F5B; --warn:#B08A2E; --err:#A8402F;
  --r:4px; --ease:cubic-bezier(.22,.61,.36,1); --sp:180ms;
  --ui:'Zen Kaku Gothic New',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono','Apple Symbols',monospace;
}
html[data-theme="dark"]{
  --paper:#14130F; --rail:#1A1815; --raise:#221F1B; --sink:#0E0D0B;
  --ink:#EDE9E1; --muted:#8E877C; --faint:#6A645B;
  --line:rgba(237,233,225,.09); --line2:rgba(237,233,225,.16);
  --accent:#E0703A; --accent-soft:rgba(224,112,58,.13);
  --ok:#7BA57B; --warn:#D9AE55; --err:#D1705C;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:var(--ui);font-size:13px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:2px;border-radius:2px}

/* ── rail ─────────────────────────────────────────────────────────────────
   No border: a tonal step separates it, which keeps the eye on the terminal
   rather than on a line drawn beside it. */
/* flex-basis is stated explicitly rather than left as `auto`: with `0 0 auto`
   the basis resolves from content, so the collapsed width was ignored. And NO
   width transition — animating width relayouts every frame, which fires the
   terminal's ResizeObserver, which calls fit(), which relayouts again; the
   transition stalled at 221.996px and never arrived. Snapping is also just
   crisper. */
aside{flex:0 0 222px;height:100%;display:flex;flex-direction:column;background:var(--rail);
  min-width:0;overflow:hidden}
.brand{padding:20px 20px 16px;font-size:12px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint)}
.brand b{color:var(--accent);font-weight:500}

.slist{flex:1 1 0;min-height:0;overflow-y:auto;padding:2px 10px 10px;display:flex;flex-direction:column;gap:1px}
.slist::-webkit-scrollbar{width:6px}
.slist::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
.slist::-webkit-scrollbar-track{background:transparent}

.sess{position:relative;display:flex;align-items:baseline;gap:9px;width:100%;
  /* These rows became <div role=button> so Space would not activate them and
     eat spaces typed into the rename field. That also dropped the button's
     default cursor, leaving an I-beam over the row and its close control. */
  cursor:default;user-select:none;
  padding:9px 22px 9px 12px;border-radius:var(--r);text-align:left;overflow:hidden;
  color:var(--muted);transition:background var(--sp) var(--ease),color var(--sp) var(--ease)}
.sess:hover{background:var(--raise);color:var(--ink)}
/* active reads as a bookmark stroke, not a filled block */
.sess.on{color:var(--ink);background:transparent}
.sess.on::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:2px;
  background:var(--accent);border-radius:2px}
/* idle    — hollow ring: present, doing nothing
   working — filled dot, slow breath
   done    — solid green, deliberately still
   needs you — amber, with rings pinging outward so it reads from a distance */
.sess .d{flex:none;position:relative;width:7px;height:7px;border-radius:99px;margin-top:5px;
  background:transparent;border:1.5px solid var(--faint);box-sizing:border-box;
  transition:background var(--sp) var(--ease),border-color var(--sp) var(--ease)}
.sess .d.busy{background:var(--accent);border-color:var(--accent);
  animation:breathe 2.2s ease-in-out infinite}
.sess .d.done{background:var(--ok);border-color:var(--ok);animation:none}
.sess .d.wait{background:var(--warn);border-color:var(--warn);animation:pulseDot 1.4s ease-in-out infinite}
/* two rings, offset in time, expanding and fading — a radar ping */
.sess .d.wait::before,.sess .d.wait::after{content:'';position:absolute;inset:-1.5px;
  border-radius:99px;border:1.5px solid var(--warn);animation:ping 1.8s ease-out infinite}
.sess .d.wait::after{animation-delay:.9s}
@keyframes breathe{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.78)}}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes ping{0%{transform:scale(1);opacity:.75}80%,100%{transform:scale(3.2);opacity:0}}
.sess.s-wait{background:color-mix(in srgb,var(--warn) 9%,transparent)}
.sess.s-wait::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:2px;
  background:var(--warn);border-radius:2px}
.sess.s-busy::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:2px;
  background:var(--accent);border-radius:2px;opacity:.6}
.sess.s-done::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:2px;
  background:var(--ok);border-radius:2px;opacity:.6}
.sess .txt{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.sess .t{display:flex;align-items:center;gap:7px;max-width:100%;font-size:13px;line-height:1.25}
.sess .t>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess .tag{flex:none;font-family:var(--mono);font-size:9px;letter-spacing:.08em;
  color:var(--faint);text-transform:uppercase}
.sess.on .tag{color:var(--accent)}
.sess .warn{flex:none;color:var(--warn);font-size:10px;font-style:normal}
.sess .p{font-family:var(--mono);font-size:10px;color:var(--faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.sess .x{cursor:pointer;position:absolute;right:6px;top:50%;transform:translateY(-50%);opacity:0;
  width:18px;height:18px;line-height:1;border-radius:3px;color:var(--faint);
  font-size:14px;transition:opacity var(--sp) var(--ease)}
.sess:hover .x{opacity:1}
.sess .x:hover{color:var(--err);background:var(--paper)}
.sess .x.armed{opacity:1;color:var(--sink);background:var(--err);font-size:11px}
/* Same feel as the tables list: the row you hold lifts and follows the pointer,
   and the rows it would displace slide out of the way to open a gap. Only the
   OTHERS animate — the held row must track the pointer with zero lag. */
.sess{transition:transform 190ms cubic-bezier(.2,.6,.35,1)}
.sess.drag-src{transition:none;z-index:6;cursor:grabbing;
  background:var(--raise);border-radius:var(--r);
  box-shadow:0 10px 26px rgba(0,0,0,.30);opacity:.97}
body.rail-dragging{cursor:grabbing}
body.rail-dragging .sess{user-select:none}
@media (prefers-reduced-motion:reduce){.sess{transition:none}}
.rename{cursor:text;user-select:text;width:100%;background:var(--sink);border:1px solid var(--accent);
  border-radius:3px;padding:3px 6px;font-family:var(--ui);font-size:13px;
  color:var(--ink);outline:none}

.railfoot{margin-top:auto;padding:10px 10px 12px;display:flex;flex-direction:column;gap:2px}
.iconrow{display:flex;gap:2px;margin-top:4px;padding-left:2px}
.ico{width:30px;height:30px;border-radius:var(--r);color:var(--faint);font-size:13px;
  display:grid;place-items:center;
  transition:background var(--sp) var(--ease),color var(--sp) var(--ease),opacity var(--sp)}
.ico:hover{background:var(--raise);color:var(--ink)}
.ico.muted{opacity:.35}
.railbtn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r);
  color:var(--muted);font-size:12.5px;
  transition:background var(--sp) var(--ease),color var(--sp) var(--ease)}
.railbtn:hover{background:var(--raise);color:var(--ink)}
.railbtn .g{flex:none;width:12px;text-align:center;color:var(--faint);font-size:13px}
.railbtn:hover .g{color:var(--accent)}
.railbtn .k{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--faint)}

/* ── terminal ─────────────────────────────────────────────────────────────── */
.work{flex:1 1 auto;min-height:0;display:flex}
/* The terminal is the product; the reader is a guest. Below ~1180px the panel
   would squeeze Claude Code under 80 columns, so it becomes an overlay instead
   of stealing width. */
.doc{flex:0 0 clamp(340px, 34vw, 620px);min-width:0;display:flex;flex-direction:column;
  background:var(--rail);border-left:1px solid var(--line)}
.doc[hidden]{display:none}
@media (max-width: 1180px){
  .doc{position:absolute;top:0;right:0;bottom:0;width:min(90vw,520px);z-index:8;
    box-shadow:-14px 0 40px rgba(0,0,0,.35)}
  .work{position:relative}
}
.dochead{display:flex;align-items:center;gap:10px;padding:11px 14px;
  border-bottom:1px solid var(--line);flex:0 0 auto}
.docname{font-family:var(--mono);font-size:12.5px;color:var(--ink);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.docscope{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent);flex:none}
.docscope.off{color:var(--warn)}
.docwarn{font-size:10.5px;color:var(--warn);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-width:0}
.docwarn[hidden]{display:none}
.docbtn{font-size:11.5px;color:var(--muted);padding:4px 9px;border-radius:var(--r);
  border:1px solid var(--line2);white-space:nowrap;transition:all var(--sp) var(--ease)}
.docbtn:hover{color:var(--accent);border-color:var(--accent)}
.docbody{flex:1 1 auto;min-height:0;overflow-y:auto;padding:16px 18px 24px;
  font-size:13px;line-height:1.62;color:var(--ink)}
.docbody::-webkit-scrollbar{width:7px}
.docbody::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
.docbody h1,.docbody h2,.docbody h3{margin:20px 0 8px;font-weight:600;line-height:1.3}
.docbody h1{font-size:17px} .docbody h2{font-size:15px} .docbody h3{font-size:13.5px;color:var(--muted)}
.docbody h1:first-child,.docbody h2:first-child{margin-top:0}
.docbody p,.docbody ul,.docbody ol{margin:0 0 12px}
.docbody ul,.docbody ol{padding-left:20px}
.docbody li{margin:3px 0}
.docbody code{font-family:var(--mono);font-size:11.5px;background:var(--raise);
  border-radius:3px;padding:1px 5px}
.docbody pre{background:var(--raise);border-radius:var(--r);padding:11px 13px;
  overflow-x:auto;margin:0 0 12px}
.docbody pre::-webkit-scrollbar{height:7px}
.docbody pre::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
.docbody pre::-webkit-scrollbar-track{background:transparent}
/* front matter holds the description — the trigger contract, and the longest
   line in any SKILL.md. Wrapping it beats scrolling to read the one thing you
   opened the file for. Real code fences still scroll. */
.docbody pre.fm{white-space:pre-wrap;word-break:break-word}
.docbody pre code{background:none;padding:0;font-size:11.5px;line-height:1.5}
.docbody blockquote{margin:0 0 12px;padding:2px 0 2px 12px;border-left:2px solid var(--line2);
  color:var(--muted)}
.docbody hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.docbody a{color:var(--accent)}
.docbody table{width:100%;border-collapse:collapse;font-size:12px;margin:0 0 12px}
.docbody th,.docbody td{border:1px solid var(--line);padding:5px 8px;text-align:left}
.docfoot{flex:0 0 auto;padding:8px 14px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:9.5px;color:var(--faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .open{flex:none;width:24px;text-align:center;color:var(--muted);font-size:15px;
  border-radius:3px;transition:color var(--sp) var(--ease)}
.row .open:hover{color:var(--accent)}
.stack{flex:1 1 auto;min-width:0;height:100%;display:flex;flex-direction:column;
  background:var(--paper);overflow:hidden}
main{flex:1 1 auto;min-height:0;position:relative;overflow:hidden}
/* Inset, NOT padded. FitAddon sizes from this element's own box and has no
   idea about padding we add, so padding made it propose more columns than fit
   and the right of every line was clipped. */
#term{position:absolute;top:16px;right:8px;bottom:8px;left:20px;padding:0}
/* xterm renders a default (white) scrollbar down the right edge. With
   scrollback:0 it scrolls nothing — tmux owns history and handles the wheel —
   so it was a bright line against a dark terminal for no purpose. */
.xterm .xterm-viewport{scrollbar-width:none;-ms-overflow-style:none;
  background-color:transparent !important}
.xterm .xterm-viewport::-webkit-scrollbar{width:0;height:0;display:none}

.dropzone{position:absolute;inset:10px;z-index:6;display:none;place-items:center;
  border:1.5px dashed var(--accent);border-radius:10px;pointer-events:none;
  background:color-mix(in srgb,var(--accent) 7%,transparent);
  color:var(--accent);font-size:13px;letter-spacing:.02em}
body.dragging-file .dropzone{display:grid}
.dropzone b{font-weight:500}
.droptoast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:7;
  background:var(--sink);border:1px solid var(--line2);border-radius:var(--r);
  padding:7px 12px;font-family:var(--mono);font-size:11px;color:var(--muted);
  box-shadow:0 6px 20px rgba(0,0,0,.25);display:none}
.droptoast.show{display:block}
.overlay{position:absolute;inset:0;display:grid;place-items:center;z-index:4;
  background:var(--paper);text-align:center;padding:24px}
.overlay h2{margin:0 0 8px;font-size:15px;font-weight:500;letter-spacing:.01em}
.overlay p{margin:0 auto 20px;color:var(--muted);font-size:12.5px;line-height:1.7;max-width:34ch}
.overlay .go{background:var(--ink);color:var(--paper);padding:10px 20px;
  border-radius:var(--r);font-size:12.5px;transition:opacity var(--sp) var(--ease)}
.overlay .go:hover{opacity:.85}

footer{display:flex;align-items:center;gap:18px;padding:8px 20px;flex:0 0 auto;
  color:var(--faint);font-family:var(--mono);font-size:10px;letter-spacing:.03em;
  white-space:nowrap;overflow:hidden;line-height:1.6}
footer .dot{width:5px;height:5px;border-radius:99px;background:var(--err);flex:none}
footer .dot.on{background:var(--ok)}
footer .grow{flex:1}
footer .skipwarn{color:var(--warn)}

/* ── sheets ───────────────────────────────────────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:20;display:none;padding-top:12vh;
  background:color-mix(in srgb, var(--paper) 55%, transparent);backdrop-filter:blur(6px)}
.scrim.open{display:block}
.sheet{width:min(560px,92vw);margin:0 auto;background:var(--sink);
  border:1px solid var(--line);border-radius:8px;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.04), 0 24px 60px rgba(0,0,0,.14)}
.sheet input.q{width:100%;padding:16px 18px;background:transparent;border:0;
  color:var(--ink);font-family:var(--ui);font-size:15px;outline:none}
.sheet .qwrap{border-bottom:1px solid var(--line)}
.sheet input.q::placeholder{color:var(--faint)}
.rows{max-height:50vh;overflow-y:auto;padding:6px}
.rows::-webkit-scrollbar{width:6px}
.rows::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px}
.row{display:flex;align-items:baseline;gap:12px;padding:9px 12px;border-radius:var(--r);
  cursor:pointer}
.row.sel{background:var(--accent-soft)}
.row.dim .t,.row.dim .s{opacity:.45}
.row.dim .kind{opacity:.55}
.row.isroot .kind,.row.ispath .kind{color:var(--ok)}
.row.isbad .kind,.row.isbad .s{color:var(--err)}
.row .kind{flex:none;width:94px;white-space:nowrap;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent)}
.row .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  flex:none;max-width:44%}
.row .s{color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;flex:1;min-width:0}
.row .star{flex:none;width:22px;text-align:center;color:var(--muted);font-size:13px;
  line-height:1;border-radius:3px;transition:color var(--sp) var(--ease)}
.row .star:hover{color:var(--warn)}
.row .star.on{color:var(--warn)}
.empty{padding:26px;text-align:center;color:var(--faint);font-size:12.5px}

.opts{display:flex;align-items:center;gap:16px;padding:12px 18px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.seg{display:inline-flex;gap:2px;background:var(--raise);border-radius:var(--r);padding:2px}
.seg button{padding:5px 13px;border-radius:3px;font-size:12px;color:var(--muted);
  transition:background var(--sp) var(--ease),color var(--sp) var(--ease)}
.seg button[aria-pressed="true"]{background:var(--sink);color:var(--ink)}
.chk{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);
  cursor:pointer;user-select:none;transition:color var(--sp) var(--ease)}
.chk input{appearance:none;width:15px;height:15px;border:1px solid var(--line2);
  border-radius:3px;background:var(--sink);display:grid;place-items:center;
  transition:all var(--sp) var(--ease);cursor:pointer}
.chk input:checked{background:var(--warn);border-color:var(--warn)}
.chk input:checked::after{content:'✓';color:var(--sink);font-size:10px;line-height:1}
.chk.armed{color:var(--warn)}
.hintline{padding:9px 18px;font-size:11px;color:var(--faint);border-top:1px solid var(--line);
  display:flex;gap:14px;flex-wrap:wrap}
kbd{font-family:var(--mono);font-size:9.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<aside>
  <div class="brand">one<b>term</b></div>
  <div class="slist" id="slist"></div>
  <div class="railfoot">
    <button class="railbtn" id="newBtn"><i class="g">+</i><span>New session</span><span class="k">&#8984;E</span></button>
    <button class="railbtn" id="paletteBtn"><i class="g">&#8801;</i><span>Search</span><span class="k">&#8984;K</span></button>
    <button class="railbtn" id="skillsBtn"><i class="g">&#9671;</i><span>Skills</span><span class="k" id="skillCount">&#8984;J</span></button>
    <div class="iconrow">
      <button class="ico" id="themeBtn" title="Light / dark">&#9680;</button>
      <button class="ico" id="soundBtn" title="Sound">&#9834;</button>
    </div>
  </div>
</aside>

<div class="stack">
  <div class="work">
  <main>
    <div id="term"></div>
    <div class="dropzone"><span>Drop files to add their paths &mdash; <b>images, docs, screenshots</b></span></div>
    <div class="droptoast" id="droptoast"></div>
    <div class="overlay" id="overlay" style="display:none"></div>
  </main>
  <aside class="doc" id="doc" hidden>
    <div class="dochead">
      <span class="docname" id="docName"></span>
      <span class="docscope" id="docScope"></span>
      <span class="docwarn" id="docWarn" hidden></span>
      <span style="flex:1"></span>
      <button class="docbtn" id="docEdit" title="Hand this file to the session">Ask Claude to edit</button>
      <button class="docbtn" id="docClose" title="Close">&#10005;</button>
    </div>
    <div class="docbody" id="docBody"></div>
    <div class="docfoot" id="docPath"></div>
  </aside>
  </div>
  <footer>
    <span><i class="dot" id="dot"></i> <span id="conn">connecting</span></span>
    <span id="cwd"></span>
    <span id="size"></span>
    <span id="skipflag" class="skipwarn"></span>
    <span class="grow"></span>
    <span>double-click a session to rename</span>
  </footer>
</div>

<div class="scrim" id="palette">
  <div class="sheet">
    <div class="opts" id="skillTabs" hidden>
      <div class="seg" id="skillseg">
        <button data-tab="all" aria-pressed="true">All</button>
        <button data-tab="fav" aria-pressed="false">&#9733; Favourites</button>
      </div>
      <span style="flex:1"></span>
      <span style="font-size:11px;color:var(--faint)" id="skillTabCount"></span>
    </div>
    <div class="qwrap"><input class="q" id="pq" placeholder="Skills, projects, sessions&hellip;" autocomplete="off" spellcheck="false"/></div>
    <div class="rows" id="plist"></div>

      <span><kbd>&#8593;&#8595;</kbd> move</span><span><kbd>&#8629;</kbd> insert</span>
      <span><kbd>&#9636;</kbd> or <kbd>&#8594;</kbd> read</span><span><kbd>&#9734;</kbd> favourite</span>
      <span><kbd>esc</kbd> close</span>

</div>

        <button data-cmd="shell" aria-pressed="false">Shell</button>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/vendor/addon-canvas.js"></script>
<script>
const $ = id => document.getElementById(id)
/* terminal palettes drawn from the same warm neutrals, so the rectangle
   belongs to the room instead of sitting on top of it */
const THEMES = {
  light:{ background:'#F7F5F1', foreground:'#1C1A17', cursor:'#C4551F',
    cursorAccent:'#F7F5F1', selectionBackground:'rgba(196,85,31,.16)',
    black:'#1C1A17', red:'#A8402F', green:'#4F7050', yellow:'#9A7420', blue:'#3A5F8A',
    magenta:'#7A5480', cyan:'#3F7178', white:'#78736B', brightBlack:'#A8A29A',
    brightRed:'#C4553F', brightGreen:'#6B9169', brightYellow:'#B98A2E',
    brightBlue:'#5580B5', brightMagenta:'#9B74A0', brightCyan:'#5A929A', brightWhite:'#1C1A17' },
  dark:{ background:'#14130F', foreground:'#EDE9E1', cursor:'#E0703A',
    cursorAccent:'#14130F', selectionBackground:'rgba(224,112,58,.22)',
    black:'#2A2721', red:'#D1705C', green:'#7BA57B', yellow:'#D9AE55', blue:'#7FA3CC',
    magenta:'#B394BC', cyan:'#79ADB3', white:'#8E877C', brightBlack:'#6A645B',
    brightRed:'#E3907E', brightGreen:'#9AC199', brightYellow:'#EBC87E',
    brightBlue:'#A2C1E0', brightMagenta:'#CDB2D3', brightCyan:'#9BC8CD', brightWhite:'#EDE9E1' },
}
let theme = localStorage.getItem('oneterm-theme')
  || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
document.documentElement.dataset.theme = theme

const term = new Terminal({
  /* One face for everything that TILES. JetBrains Mono lacks exactly three
     glyphs Claude Code uses — ✻ ⏺ ⎿ — and those are standalone symbols, so a
     fallback for them costs nothing; a fallback mid-artwork costs seams. */
  fontFamily:"'JetBrains Mono', 'Apple Symbols', monospace", fontSize:13, lineHeight:1.0,
  cursorBlink:true, allowProposedApi:true, scrollback:0, /* tmux owns history */
  theme:THEMES[theme], macOptionIsMeta:true,
  // NO minimumContrastRatio. It floors foreground contrast against the
  // background, which reads as a fix for text and as vandalism for ART: the
  // Claude Code mascot is truecolor block characters where the colour IS the
  // picture, and forcing contrast collapsed it into black rectangles. Light
  // mode legibility is handled by telling Claude Code the background is light
  // (COLORFGBG, set on the pty) so it picks its own readable palette, instead
  // of us overriding colours it deliberately chose.
})
const fit = new FitAddon.FitAddon()
term.loadAddon(fit); term.open($('term'))
/* The CANVAS renderer, for one specific reason: it implements customGlyphs,
   which draws Block Elements and Box Drawing as filled rectangles snapped to
   the cell instead of painting font glyphs. The cell here is 7.798px wide —
   fractional — so font-drawn blocks land on sub-pixel boundaries and adjacent
   ones do not quite meet, which is the stitching visible through the Claude
   Code mascot. Native terminals draw these the same way.
   (WebGL also does this but cached stale dimensions across layout changes and
   painted garbage into the freed width; canvas re-measures correctly.) */
/* The atlas is rasterised from whatever font is available AT THAT MOMENT. Load
   the renderer before the webfont arrives and it bakes the fallback's metrics,
   which shows up as a few glyphs rendering undersized and off-baseline. So:
   wait for the font, then attach the renderer, then rebuild the atlas. */
document.fonts.ready.then(async () => {
  try { await document.fonts.load('13px "JetBrains Mono"') } catch {}
  try { await document.fonts.load('bold 13px "JetBrains Mono"') } catch {}
  try {
    term.loadAddon(new CanvasAddon.CanvasAddon())
    term.clearTextureAtlas?.()
  } catch (e) { console.warn('canvas renderer unavailable, using DOM', e) }
  scheduleResize()
})

let sessions = [], active = localStorage.getItem('oneterm-active'), ws = null
let retry = 0, retryTimer = null, wantId = null
let skills = [], projects = []
const activity = new Map()
const api  = p => fetch(p).then(r => r.json()).catch(() => null)
// State-changing calls must not be GETs: a GET is reachable from an <img> tag
// on any page you happen to have open. The server rejects non-POST for these.
const post = p => fetch(p, { method: 'POST' }).then(r => r.json()).catch(() => null)
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
const tilde = p => (p||'').replace(/^\/Users\/[^/]+/, '~')

/* ── connection ──────────────────────────────────────────────────────────── */
function connect(id){
  wantId = id; clearTimeout(retryTimer)
  if (ws){ const o = ws; ws = null; o.onclose = null; o.close() }
  if (!id){ setConn(false,'no session'); return }
  term.reset(); fit.fit()
  const sock = new WebSocket(`ws://${location.host}/pty?id=${encodeURIComponent(id)}&cols=${term.cols}&rows=${term.rows}&light=${theme==='light'?1:0}`)
  ws = sock
  sock.onopen = () => { if (ws!==sock) return
    retry = 0
    const m = sessions.find(x => x.id === id)
    setConn(true, m ? (m.cmd === 'claude' ? 'claude' : 'shell') : 'connected')
    sendResize(); term.focus() }
  sock.onmessage = e => { if (ws===sock) term.write(e.data) }
  sock.onclose = async (ev) => {
    if (ws !== sock) return
    /* A dead session must not be retried. Reconnecting is for a dropped
       connection; if the server says the session is GONE, retrying just
       reprints the error every few seconds forever. */
    if (ev.code === 4404){
      ws = null; wantId = null; retry = 0
      setConn(false, 'session ended')
      activity.delete(id)
      await refresh()
      const next = sessions.find(s2 => s2.id !== id)
      if (next) switchTo(next.id)
      else { term.reset(); firstRun(); setConn(false, 'no session') }
      return
    }
    setConn(false, 'reconnecting'); scheduleRetry()
  }
  sock.onerror = () => { if (ws===sock) setConn(false,'reconnecting') }
}
function scheduleRetry(){
  // Give up eventually rather than sit in a silent retry loop forever.
  if (retry > 12){ setConn(false, 'disconnected — reload to retry'); return }
  retryTimer = setTimeout(() => connect(wantId), Math.min(500 * 2 ** retry++, 8000))
}
function setConn(on,label){ $('dot').className = 'dot'+(on?' on':''); $('conn').textContent = label }
function sendResize(){
  fit.fit()
  /* Never render a PARTIAL last row. fit() floors on the cell height, but a
     fractional lineHeight (1.18) leaves a sliver, and `main` clips it — which
     ate the bottom of Claude Code's status bar. If the rows would not fully
     fit, give one back. */
  try {
    const cell = term._core?._renderService?.dimensions?.css?.cell?.height
    const host = $('term'), cs = getComputedStyle(host)
    const avail = host.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)
    if (cell > 0 && term.rows * cell > avail + 0.5)
      term.resize(term.cols, Math.max(1, term.rows - 1))
  } catch {}
  $('size').textContent = `${term.cols}×${term.rows}`
  if (ws?.readyState === 1) ws.send(JSON.stringify({t:'resize',cols:term.cols,rows:term.rows}))
}
/* fit.fit() mutates the very element this observer watches, so calling it
   synchronously re-triggers the observer — a feedback loop that starves layout
   (the rail never settled at its collapsed width, and a forced reflow could
   hang the renderer outright). Coalesce to one call per frame and guard
   re-entry so a resize can never drive another resize. */
let resizeTimer = 0, resizing = false, lastResizeAt = 0
/* THROTTLE, not debounce. A pure debounce clears its own timer on every event,
   so during a continuous window drag it never fires and the terminal only
   catches up when you let go — leaving a strip of unfilled width trailing the
   container edge for the whole drag. This fits at most every 60ms WHILE
   dragging, and once more after it stops to land on the exact final size.
   Not requestAnimationFrame: rAF is throttled to zero in a background tab, so
   a resize scheduled there would never run at all. */
const RESIZE_EVERY = 60
const runResize = () => {
  if (resizing) return
  resizing = true
  lastResizeAt = Date.now()
  try { sendResize() } finally { resizing = false }
}
const scheduleResize = () => {
  const since = Date.now() - lastResizeAt
  if (since >= RESIZE_EVERY) runResize()          // keep up during the drag
  clearTimeout(resizeTimer)
  resizeTimer = setTimeout(runResize, RESIZE_EVERY)  // and settle exactly at the end
}
new ResizeObserver(scheduleResize).observe($('term'))
addEventListener('resize', scheduleResize)
term.onData(d => { if (ws?.readyState === 1) ws.send(JSON.stringify({t:'in',d})) })

/* ── busy / done ──────────────────────────────────────────────────────────
   State is derived SERVER-side in refresh() for every session, attached or not.
   The old client-side markBusy()/2.5s-idle timer that used to live here is gone:
   nothing rendered it any more, but it still fired notifications on its own —
   bypassing the MIN_RUN/COOLDOWN debouncing — and by setting `notified` first it
   could silently suppress the chime refresh() was about to make. */
function notifyDone(id){
  const s = sessions.find(x => x.id === id)
  if (document.hasFocus() && id === active) return
  if (window.Notification?.permission === 'granted')
    new Notification('oneterm', { body: (s?.label ?? id) + ' finished', tag:id })
}
/* The tab is the only thing you can see when oneterm is in the background, so
   it carries state too: a drawn favicon badge, amber when a session is blocked
   on you, accent while something is running. */
let lastIcon = ''
function paintFavicon(){
  const waiting = sessions.filter(s => s.waiting).length
  const working = sessions.some(s => s.working)
  // "done, and you haven't looked at it yet" is the state you most need in the
  // tab, because by definition you tabbed away. It was the one state missing.
  const done = sessions.filter(s =>
    (activity.get(s.id) || {}).doneUnseen && s.id !== active).length
  const key = waiting ? 'w' + waiting : working ? 'r' : done ? 'd' + done : 'i'
  if (key === lastIcon) return          // redrawing every poll is wasteful
  lastIcon = key
  const c = document.createElement('canvas'); c.width = c.height = 32
  const g = c.getContext('2d')
  const dark = document.documentElement.dataset.theme === 'dark'
  g.fillStyle = dark ? '#14130F' : '#F7F5F1'
  g.beginPath(); g.roundRect(0, 0, 32, 32, 7); g.fill()
  // the prompt chevron, same mark as the app
  g.strokeStyle = dark ? '#EDE9E1' : '#1C1A17'
  g.lineWidth = 3.2; g.lineCap = 'round'; g.lineJoin = 'round'
  g.beginPath(); g.moveTo(10, 10); g.lineTo(18, 16); g.lineTo(10, 22); g.stroke()
  if (waiting || working || done){
    g.beginPath(); g.arc(25, 7, 6.5, 0, Math.PI * 2)
    // same language as the rail: amber blocked, accent running, green finished
    g.fillStyle = waiting ? '#D9AE55' : working ? '#E0703A' : '#7BA57B'; g.fill()
    g.strokeStyle = dark ? '#14130F' : '#F7F5F1'; g.lineWidth = 2; g.stroke()
  }
  $('favicon').href = c.toDataURL('image/png')
}

/* The title is the only thing visible when the tab is backgrounded, so it must
   describe the CURRENT state — it used to be written once on notify and then
   go stale, naming a session you had already switched away from. */
function paintTitle(){
  const waiting = sessions.filter(s => s.waiting)
  const cur = sessions.find(s => s.id === active)
  const finished = sessions.filter(s =>
    (activity.get(s.id) || {}).doneUnseen && s.id !== active)
  document.title = waiting.length
    ? '● ' + (waiting.length > 1 ? waiting.length + ' need you' : waiting[0].label + ' needs you')
    : finished.length
    ? '✓ ' + (finished.length > 1 ? finished.length + ' done' : finished[0].label + ' done')
    : (cur ? cur.label + ' — oneterm' : 'oneterm')
  paintFavicon()
}

/* ── sound ───────────────────────────────────────────────────────────────
   Synthesised, so there are no asset files and nothing to load. Browsers block
   audio until the page has been interacted with, so the context is created
   lazily on the first real gesture and resumed if suspended. */
let audioCtx = null
let soundOn = localStorage.getItem('oneterm-sound') !== '0'
function unlockAudio(){
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)()
    if (audioCtx.state === 'suspended') audioCtx.resume()
  } catch {}
}
for (const ev of ['pointerdown','keydown']) addEventListener(ev, unlockAudio)

/* Every open tab runs its own copy of this client, polls independently and
   reached its own conclusions — so N tabs meant N chimes for one event. The
   claim is a shared timestamp in localStorage: the first tab to write it wins
   and the rest stay quiet. */
function claimChime(key, windowMs = 4000){
  try {
    const k = 'oneterm-chime:' + key, now = Date.now()
    if (now - Number(localStorage.getItem(k) || 0) < windowMs) return false
    localStorage.setItem(k, String(now))
    return true
  } catch { return true }
}

function tone(steps, gain = 0.06){
  if (!soundOn) return
  unlockAudio()
  if (!audioCtx || audioCtx.state !== 'running') return
  const t0 = audioCtx.currentTime
  steps.forEach(([freq, at, dur]) => {
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain()
      osc.type = 'sine'; osc.frequency.value = freq
    // short attack + exponential decay reads as a soft wooden knock, not a beep
    g.gain.setValueAtTime(0.0001, t0 + at)
    g.gain.exponentialRampToValueAtTime(gain, t0 + at + 0.012)
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + dur)
    osc.connect(g); g.connect(audioCtx.destination)
    osc.start(t0 + at); osc.stop(t0 + at + dur + 0.02)
  })
}
/* Same notes, same envelope, same sine as always — only the LEVEL changed.
   Measured on the rendered output: peaks 0.69 and 0.89 of full scale, no
   clipping, and louder than the triangle version this replaced. */
// finished: a soft two-note fall, easy to ignore
const soundDone  = () => tone([[784, 0, 0.18], [588, 0.12, 0.26]], 0.7)
// blocked on you: rising and repeated, meant to be noticed
const soundNeeds = () => tone([[523, 0, 0.15], [784, 0.11, 0.15], [1046, 0.22, 0.26]], 0.9)

/* ── rail ────────────────────────────────────────────────────────────────── */
let dragId = null, armedKill = null, armTimer = null, lastSig = '', renaming = false

/* Pointer-driven sorting, modelled on dnd-kit's vertical list strategy (what
   the tables list uses). HTML5 drag-and-drop cannot do this: it hands you an
   OS ghost image and no control over the other items, so the best it managed
   was a hairline showing where the drop would land. Here the neighbours
   actually move. */
let drag = null
const DRAG_THRESHOLD = 4          // px before a press becomes a drag, so clicks survive

function beginDrag(e, el, id){
  if (e.button !== 0 || renaming) return
  if (e.target.closest('.x') || e.target.closest('input')) return   // kill button, rename field
  const rows = [...$('slist').children]
  const idx = rows.indexOf(el)
  if (idx < 0) return
  const rects = rows.map(r => r.getBoundingClientRect())
  const step = rows.length > 1 ? rects[1].top - rects[0].top : rects[0].height
  drag = { id, el, rows, idx, to: idx, step, startY: e.clientY, moved: false }
  el.setPointerCapture?.(e.pointerId)
  el.onpointermove = onDragMove
  el.onpointerup = el.onpointercancel = endDrag
}

function onDragMove(e){
  if (!drag) return
  const dy = e.clientY - drag.startY
  if (!drag.moved){
    if (Math.abs(dy) < DRAG_THRESHOLD) return      // still a click, not a drag
    drag.moved = true; dragId = drag.id
    document.body.classList.add('rail-dragging')
    drag.el.classList.add('drag-src')
  }
  drag.el.style.transform = `translateY(${dy}px)`

  // where would it land? one step of travel = one position
  const to = Math.max(0, Math.min(drag.rows.length - 1, drag.idx + Math.round(dy / drag.step)))
  if (to !== drag.to){ drag.to = to; layoutGap() }
}

/* Everything between the origin and the target shifts by one row, opening a
   gap exactly where the held row will land. */
function layoutGap(){
  const { rows, idx, to, step, el } = drag
  rows.forEach((r, i) => {
    if (r === el) return
    let shift = 0
    if (idx < to && i > idx && i <= to) shift = -step
    else if (idx > to && i >= to && i < idx) shift = step
    r.style.transform = shift ? `translateY(${shift}px)` : ''
  })
}

async function endDrag(e){
  if (!drag) return
  const d = drag; drag = null
  d.el.onpointermove = d.el.onpointerup = d.el.onpointercancel = null
  d.el.releasePointerCapture?.(e.pointerId)
  for (const r of d.rows) r.style.transform = ''
  d.el.classList.remove('drag-src')
  document.body.classList.remove('rail-dragging')
  if (!d.moved){ dragId = null; return }            // it was a click after all
  if (d.to === d.idx){ dragId = null; paintRail(); return }

  const next = sessions.slice()
  const [moved] = next.splice(d.idx, 1)
  next.splice(d.to, 0, moved)
  sessions = next
  dragId = null
  paintRail()                                       // optimistic: no wait, no flicker
  await post('/reorder?ids=' + sessions.map(x => x.id).join(','))
}

async function refresh(){
  if (dragId || renaming) return                             // never repaint mid-drag
  const list = await api('/sessions'); if (!list) return
  for (const s of list){
    const a = activity.get(s.id) ?? {}
    /* Sounds fire on STABLE transitions only. Both signals are sampled — a
       one-poll blip in either used to ring the bell, which is why it went off
       at random. Requirements:
         · a run must have lasted >= MIN_RUN before "done" can chime
         · "needs you" must hold for 2 consecutive polls
         · at most one chime per session per COOLDOWN */
    const now = Date.now()
    const MIN_RUN = 4000, COOLDOWN = 12000, HOLD = 2

    if (s.working){
      if (!a.wasWorking) a.workStart = now       // start of a real run
      a.doneUnseen = false; a.notified = false
      a.quiet = 0
    } else if (a.wasWorking) {
      a.quiet = (a.quiet ?? 0) + 1
    }
    /* The server latches "working" for 5s past the last positive sample, so by
       the time it reports not-working the run has genuinely ended. One
       confirming poll on top of that is enough; two only delayed the chime. */
    if (a.wasWorking && !s.working && !s.waiting && a.quiet >= 1){
      const ranFor = now - (a.workStart ?? now)
      if (ranFor >= MIN_RUN){
        a.doneUnseen = true
        if (!a.notified && now - (a.lastChime ?? 0) > COOLDOWN){
          a.notified = true; a.lastChime = now
          notifyDone(s.id)
          if (claimChime('done:' + s.id)) soundDone()
        }
      }
      a.wasWorking = false      // the run is over; do not re-evaluate it
    }
    // blocked on a human: only after it has held for two polls running
    a.waitStreak = s.waiting ? (a.waitStreak ?? 0) + 1 : 0
    if (a.waitStreak === HOLD && now - (a.lastChime ?? 0) > COOLDOWN){
      a.lastChime = now
      if (claimChime('wait:' + s.id)) soundNeeds()
      if (window.Notification?.permission === 'granted')
        new Notification('oneterm', { body: s.label + ' needs you', tag: s.id + '-wait' })
    }
    if (s.working) a.wasWorking = true
    a.wasWaiting = s.waiting
    activity.set(s.id, a)
  }
  const sig = JSON.stringify(list.map(s => [s.id, s.label, s.cwd, s.waiting, s.working, s.cmd, s.skip,
                                            (activity.get(s.id)||{}).doneUnseen]))
  const changed = sig !== lastSig; lastSig = sig
  sessions = list
  if (!sessions.some(s => s.id === active)) active = sessions[0]?.id ?? null
  // a 4s poll that repaints unconditionally restarts the pulse too
  if (changed) paintRail(); else paintTitle()
  return sessions
}
function paintRail(){
  if (renaming) return          // a repaint mid-rename destroys the input you're typing in
  const box = $('slist'); box.innerHTML = ''
  for (const s of sessions){
    const a = activity.get(s.id) ?? {}
    /* State comes from the SERVER for every session, attached or not. Client-side
       socket traffic only ever knew about the one session you were looking at.
       Priority: blocked-on-you > working > finished-unseen > idle. */
    const st = s.waiting ? 'wait' : s.working ? 'busy' : (a.doneUnseen && s.id !== active ? 'done' : '')
    const cls = st
    const el = document.createElement('div')
    el.setAttribute('role', 'button'); el.tabIndex = 0
    el.className = 'sess' + (s.id === active ? ' on' : '') + (st ? ' s-' + st : '')
    el.title = s.cwd + (s.skip ? '  ·  permissions skipped' : '') + '  ·  double-click to rename'
    el.innerHTML =
      '<i class="d ' + cls + '"></i><span class="txt">' +
      '<span class="t"><span class="nm">' + esc(s.label) + '</span>' +
      '<i class="tag">' + (s.cmd === 'claude' ? 'cc' : 'sh') + '</i>' +
      (st === 'wait'  ? '<i class="need">needs you</i>' : '') +
      (st === 'busy'  ? '<i class="need work">working</i>' : '') +
      (st === 'done'  ? '<i class="need fin">done</i>' : '') +
      (s.skip ? '<i class="warn">!</i>' : '') +
      '</span><span class="p">' + esc(tilde(s.cwd)) + '</span></span>'
    el.onclick = () => switchTo(s.id)
    el.onkeydown = e => {                       // keep keyboard activation, minus Space
      if (renaming) return
      if (e.key === 'Enter'){ e.preventDefault(); switchTo(s.id) }
      if (e.key === 'F2'){ e.preventDefault(); startRename(el, s) }
    }
    // dblclick anywhere in the row, not just on the ~90px name
    el.ondblclick = e => { e.preventDefault(); e.stopPropagation(); startRename(el, s) }
    el.dataset.id = s.id
    el.onpointerdown = e => beginDrag(e, el, s.id)
    const x = document.createElement('span')
    const armed = armedKill === s.id
    x.className = 'x' + (armed ? ' armed' : '')
    x.textContent = armed ? '✓' : '×'
    x.title = armed ? 'click again to end this session' : 'end session'
    x.onclick = e => {
      e.stopPropagation()
      // A Claude session holds hours of context and there is no undo once tmux
      // kills it. One stray 12px click should not vaporise that.
      if (s.cmd === 'claude' && !armed){
        armedKill = s.id; paintRail()
        clearTimeout(armTimer); armTimer = setTimeout(() => { armedKill = null; paintRail() }, 3000)
        return
      }
      armedKill = null; killSession(s.id)
    }
    el.appendChild(x); box.appendChild(el)
  }
  const cur = sessions.find(x => x.id === active)
  $('cwd').textContent = cur ? tilde(cur.cwd) : ''
  paintTitle()
  $('skipflag').textContent = cur?.skip ? 'permissions skipped' : ''
}
function startRename(el, s){
  const holder = el.querySelector('.nm'); if (!holder) return
  const input = document.createElement('input')
  input.className = 'rename'; input.value = s.label; input.maxLength = 60
  holder.replaceWith(input); input.focus(); input.select()
  renaming = true
  let settled = false
  const restore = () => {
    if (settled) return; settled = true
    const span = document.createElement('span')
    span.className = 'nm'; span.textContent = s.label
    input.replaceWith(span)
    renaming = false
  }
  const commit = async () => {
    if (settled) return
    const v = input.value.trim()
    if (v && v !== s.label){
      settled = true; renaming = false
      await post('/rename?id=' + encodeURIComponent(s.id) + '&label=' + encodeURIComponent(v))
      await refresh(); paintRail()
    } else restore()
  }
  input.onclick = e => e.stopPropagation()
  input.ondblclick = e => e.stopPropagation()
  input.onblur = commit
  input.onkeyup = e => e.stopPropagation()
  input.onkeypress = e => e.stopPropagation()
  input.onkeydown = e => {
    e.stopPropagation()
    if (e.key === ' ') e.stopImmediatePropagation()   // never let Space reach the row
    if (e.key === 'Enter'){ e.preventDefault(); commit() }
    if (e.key === 'Escape'){ e.preventDefault(); restore() }
  }
}
async function switchTo(id){
  if (id === active){ term.focus(); return }
  active = id; localStorage.setItem('oneterm-active', id)
  const a = activity.get(id); if (a){ a.doneUnseen = false; a.notified = false }
  paintRail(); connect(id)
}
async function newSession(cmd, cwd, skip){
  const r = await post('/new?cmd=' + cmd + '&cwd=' + encodeURIComponent(cwd || '') +
    '&skip=' + (skip ? 1 : 0) + '&cols=' + term.cols + '&rows=' + term.rows)
  if (!r?.id){ toast(r?.error === 'no_such_directory' ? 'no such directory: ' + (r.cwd||'') : "couldn't start that session"); return }
  hideOverlay(); await refresh()
  active = r.id; localStorage.setItem('oneterm-active', r.id); paintRail(); connect(r.id)
}
async function killSession(id){
  const wasAttached = id === wantId
  await post('/kill?id=' + encodeURIComponent(id))
  activity.delete(id); await refresh()
  if (!sessions.length) { term.reset(); firstRun() }
  // Reconnecting unconditionally tore down a healthy socket and blanked the
  // pane you were reading, just because a DIFFERENT session was killed.
  else if (wasAttached) connect(active)
}

/* ── sheets ──────────────────────────────────────────────────────────────── */
let openSheet = null, sel = 0, items = [], newCmd = 'claude', paletteMode = 'all'
/* Favourites live in the browser: they are a per-person shortcut list, not
   shared state, and they must survive a host restart. */
let skillTab = 'all'
let favs = new Set()
try { favs = new Set(JSON.parse(localStorage.getItem('oneterm-favs') || '[]')) } catch {}
const saveFavs = () => localStorage.setItem('oneterm-favs', JSON.stringify([...favs]))
function toggleFav(name){
  favs.has(name) ? favs.delete(name) : favs.add(name)
  saveFavs(); render()
}
const skipOn = () => $('skipbox').checked
function showSheet(which, mode = 'all'){
  openSheet = which; sel = 0; paletteMode = mode; skillTab = 'all'
  $(which === 'palette' ? 'palette' : 'newsheet').classList.add('open')
  if (which === 'new'){
    // Chrome restores form state across reloads, so this box could come back
    // ticked with nothing in the app having ticked it. Whether the next agent
    // runs with guardrails must never be decided by browser state.
    $('skipbox').checked = false
    $('skipwrap').classList.remove('armed')
  }
  const inp = which === 'palette' ? $('pq') : $('nq')
  inp.value = ''
  inp.placeholder = paletteMode === 'skill'
    ? 'Skills and slash commands…' : 'Skills, projects, sessions…'
  $('skillTabs').hidden = !(which === 'palette' && paletteMode === 'skill')
  for (const o of $('skillseg').children) o.setAttribute('aria-pressed', String(o.dataset.tab === skillTab))
  inp.focus(); render()
}
function closeSheet(){
  if (!openSheet) return
  $(openSheet === 'palette' ? 'palette' : 'newsheet').classList.remove('open')
  openSheet = null; term.focus()
}
function paletteItems(){
  const out = []
  // "Skills" opens the same sheet scoped to skills, so you can browse the list
  // without knowing a name — the whole point of asking for a dropdown.
  if (paletteMode === 'skill'){
    /* Show EVERY skill you own, labelled with where it comes from. A project
       skill only actually loads for a session inside that project, so the ones
       that cannot fire here are dimmed and say so when picked — but they are
       still listed, because you cannot browse what you cannot see. */
    const cwd = sessions.find(x => x.id === active)?.cwd || ''
    const usable = k => k.scope !== 'project'
      || (k.dir && (cwd === k.dir || cwd.startsWith(k.dir + '/')))
    const pool = skillTab === 'fav' ? skills.filter(k => favs.has(k.path)) : skills
    return pool.slice()
      .sort((a, b) =>
        (usable(b) - usable(a)) ||                       // usable here, first
        ((b.scope === 'project') - (a.scope === 'project')) ||
        a.name.localeCompare(b.name))
      .map(k => {
        const here = usable(k)
        return {
          kind: k.scope === 'project' ? k.project.slice(0, 12)
              : k.kind === 'command' ? 'command' : 'global',
          // name is NOT identity: a project /push and a global /push are two
          // different files. Everything downstream keys off the path.
          name: k.name, path: k.path, skill: k,
          t: '/' + k.name, s: k.desc || '',
          dim: !here, project: k.project, dir: k.dir,
          run: () => {
            typeIn('/' + k.name + ' ')
            if (!here) toast(`/${k.name} is a ${k.project} skill — it loads in a session there`, 4200)
          },
        }
      })
  }
  for (const s of sessions) if (s.id !== active)
    out.push({kind:'session', t:s.label, s:tilde(s.cwd), run:() => switchTo(s.id)})
  for (const s2 of sessions)
    out.push({kind:'rename', t:'Rename ' + s2.label, s:tilde(s2.cwd), run:() => {
      const row = [...$('slist').children].find(n => n.dataset.id === s2.id)
      if (row) startRename(row, s2)
    }})
  for (const p of projects)
    out.push({kind:'open', t:p.name, s:tilde(p.path), run:() => newSession('claude', p.path, false)})
  for (const k of skills)
    out.push({kind:'skill', t:'/' + k.name, s:k.desc, run:() => typeIn('/' + k.name + ' ')})
  return out
}
function newItems(){
  const out = projects.map(p => ({
    kind: p.root ? 'root' : (newCmd === 'claude' ? 'claude' : 'shell'),
    t: p.name, s: tilde(p.path),
    run: () => newSession(newCmd, p.path, skipOn())}))
  /* Anywhere on disk, not just ~/Projects and not just its children. Typing a
     path offers it directly once the server confirms the directory exists. */
  const q = $('nq')?.value.trim() || ''
  if (/^[~/]/.test(q)) out.unshift({
    kind: 'path', t: q, always: true,          // never filtered by its own query
    s: typedPathOk === q ? 'open here' : typedPathChecked === q ? 'no such directory' : 'checking…',
    bad: typedPathChecked === q && typedPathOk !== q,
    run: () => { typedPathOk === q ? newSession(newCmd, q, skipOn())
                                   : toast('no such directory: ' + q) }})
  return out
}
let typedPathOk = null, typedPathChecked = null
async function checkTypedPath(){
  const q = $('nq').value.trim()
  if (!/^[~/]/.test(q)) { typedPathOk = typedPathChecked = null; return }
  const r = await api('/resolve?path=' + encodeURIComponent(q))
  if ($('nq').value.trim() !== q) return          // the query moved on
  typedPathChecked = q; typedPathOk = r?.ok ? q : null
  render()
}
function typeIn(t){ if (ws?.readyState === 1) ws.send(JSON.stringify({t:'in',d:t})); term.focus() }
/* Unranked subsequence over name+description+path meant a 6-char query barely
   filtered: "commit" matched "cosmic-drift" (c-o-m-i-t) and every project with
   a 'k' in ~/Projects. Score by WHERE it matched, weight the name far above the
   description, and return 0 — a real miss — rather than a weak match. */
const subseq = (q, hay) => {
  let i = 0; for (const ch of q){ i = hay.indexOf(ch, i); if (i < 0) return false; i++ }
  return true
}
function fuzzy(q, it){
  if (!q) return 1
  const name = it.t.toLowerCase().replace(/^\//, '')
  const desc = (it.s || '').toLowerCase()
  if (name === q) return 1000
  if (name.startsWith(q)) return 600
  if (name.includes(q)) return 400
  if (new RegExp('\\b' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).test(name)) return 350
  if (subseq(q, name)) return 150
  if (desc.includes(q)) return 60
  return 0
}
function render(){
  const isP = openSheet === 'palette'
  const q = (isP ? $('pq') : $('nq')).value.trim().toLowerCase()
  items = (isP ? paletteItems() : newItems())
    .map(it => [it.always ? Infinity : fuzzy(q, it), it]).filter(x => x[0] > 0)
    // 80 truncated the skills list, which breaks the one case it exists for:
    // browsing when you do NOT know the name. The rows are cheap; show them.
    .sort((a,b) => b[0] - a[0]).map(x => x[1]).slice(0, 300)
  if (sel >= items.length) sel = Math.max(0, items.length - 1)
  const box = $(isP ? 'plist' : 'nlist')
  const starred = paletteMode === 'skill' && isP
  box.innerHTML = items.length ? items.map((it,i) =>
    '<div class="row' + (i === sel ? ' sel' : '') + (it.dim ? ' dim' : '') +
      (it.kind === 'root' ? ' isroot' : it.kind === 'path' ? (it.bad ? ' isbad' : ' ispath') : '') +
      '" data-i="' + i + '">' +
    (starred ? '<span class="star' + (favs.has(it.path) ? ' on' : '') + '" data-fav="' +
       esc(it.path) + '" title="favourite">' + (favs.has(it.path) ? '★' : '☆') + '</span>' : '') +
    (starred ? '<span class="open" data-open="' + i + '" title="Read this skill">&#9636;</span>' : '') +
    '<span class="kind">' + it.kind + '</span><span class="t">' + esc(it.t) + '</span>' +
    '<span class="s">' + esc(it.s || '') + '</span></div>').join('')
    : '<div class="empty">' +
      (starred && skillTab === 'fav'
        ? (favs.size ? 'No favourites match “' + esc(q) + '”'
                     : 'No favourites yet — tap a star to add one')
        : 'nothing matches') + '</div>'
  for (const el of box.children) if (el.dataset && el.dataset.i !== undefined){
    el.onclick = () => go(Number(el.dataset.i))
    const st = el.querySelector('.star')
    if (st) st.onclick = e => { e.stopPropagation(); toggleFav(st.dataset.fav) }
    const op = el.querySelector('.open')
    if (op) op.onclick = e => {
      e.stopPropagation()
      const it = items[Number(op.dataset.open)]
      // open THIS row's file. Looking it up by name opened the global copy when
      // you clicked the project row, and stamped the wrong scope on the panel.
      if (it?.skill){ closeSheet(); openDoc(it.skill) }
    }
  }
  if (starred) $('skillTabCount').textContent =
    skillTab === 'fav' ? favs.size + ' favourite' + (favs.size === 1 ? '' : 's')
                       : items.length + ' skills · ' + items.filter(i => !i.dim).length + ' available here'
  box.children[sel]?.scrollIntoView({block:'nearest'})
  $('folderCount').textContent = projects.length + ' folders'
}
function go(i){ const it = items[i]; if (!it) return; closeSheet(); it.run() }

$('pq').oninput = () => { sel = 0; render() }
$('nq').oninput = () => { sel = 0; render(); checkTypedPath() }
for (const b of $('cmdseg').children) b.onclick = () => {
  newCmd = b.dataset.cmd
  for (const o of $('cmdseg').children) o.setAttribute('aria-pressed', String(o === b))
  const on = newCmd === 'claude'
  $('skipwrap').style.opacity = on ? '1' : '.35'
  $('skipbox').disabled = !on
  render()
}
$('skipbox').onchange = () => $('skipwrap').classList.toggle('armed', skipOn())
for (const el of [$('palette'), $('newsheet')])
  el.addEventListener('mousedown', e => { if (e.target === el) closeSheet() })

addEventListener('keydown', e => {
  const meta = e.metaKey || e.ctrlKey
  if (meta && e.key.toLowerCase() === 'k'){ e.preventDefault()
    if (openSheet === 'palette') closeSheet(); else { closeSheet(); showSheet('palette') }; return }
  if (meta && e.key.toLowerCase() === 'e'){ e.preventDefault()
    if (openSheet === 'new') closeSheet(); else { closeSheet(); showSheet('new') }; return }
  if (meta && e.key.toLowerCase() === 'j'){ e.preventDefault()
    if (openSheet === 'palette' && paletteMode === 'skill') closeSheet()
    else { closeSheet(); showSheet('palette', 'skill') }; return }
  if (meta && /^[1-9]$/.test(e.key)){
    const t = sessions[Number(e.key) - 1]
    if (t){ e.preventDefault(); closeSheet(); switchTo(t.id) }
    return
  }
  // Escape with the reader open must close the READER. It used to fall through
  // to xterm, which with Claude mid-turn means the reflex "close this" keystroke
  // interrupts the agent instead.
  if (!openSheet && docOpen && e.key === 'Escape'){ e.preventDefault(); closeDoc(); return }
  if (!openSheet) return
  if (e.key === 'Escape'){ e.preventDefault(); closeSheet() }
  else if (e.key === 'ArrowRight' && paletteMode === 'skill'){
    const it = items[sel]                    // the sheet is keyboard-first; the reader was not
    if (it?.skill){ e.preventDefault(); closeSheet(); openDoc(it.skill) }
  }
  else if (e.key === 'ArrowDown'){ e.preventDefault(); sel = Math.min(sel + 1, items.length - 1); render() }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); sel = Math.max(sel - 1, 0); render() }
  else if (e.key === 'Enter'){ e.preventDefault(); go(sel) }
}, true)


function paintSound(){

$('soundBtn').onclick = () => {

$('newBtn').onclick = () => showSheet('new')
$('paletteBtn').onclick = () => showSheet('palette')
$('skillsBtn').onclick   = () => showSheet('palette', 'skill')
for (const b of $('skillseg').children) b.onclick = () => {

/* ── skill viewer ─────────────────────────────────────────────────────────
   Opens BESIDE the terminal rather than over it: the terminal keeps running and
   reflows to the remaining width, so you can read a skill and keep working. The
   markdown is rendered here rather than by a library — the whole app ships no
   runtime dependencies, and everything is escaped before any markup is added,
   because file contents are never trusted input. */
let docOpen = null

const mdEsc = t => t.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
function mdInline(t){
  return mdEsc(t)
    .replace(/`([^`]+)`/g, (_,c) => '<code>' + c + '</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|\W)\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
      (_,t2,u) => '<a href="' + mdEsc(u) + '" target="_blank" rel="noreferrer">' + t2 + '</a>')
}
function renderMd(src){
  const out = []
  const lines = src.split(/\r?\n/)
  let i = 0, list = null
  const closeList = () => { if (list){ out.push('</' + list + '>'); list = null } }
  while (i < lines.length){
    const ln = lines[i]
    // front matter, shown as a quiet header block rather than raw dashes
    if (i === 0 && /^---\s*$/.test(ln)){
      const buf = []; i++
      while (i < lines.length && !/^---\s*$/.test(lines[i])) buf.push(lines[i++])
      i++
      closeList()
      out.push('<pre class="fm"><code>' + mdEsc(buf.join('\n')) + '</code></pre>')
      continue
    }
    const fence = /^```(.*)$/.exec(ln)
    if (fence){
      const buf = []; i++
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++])
      i++
      closeList(); out.push('<pre><code>' + mdEsc(buf.join('\n')) + '</code></pre>')
      continue
    }
    // a table: header row, a |---| separator, then body rows
    if (/^\s*\|.*\|\s*$/.test(ln) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] || '')){
      const cells = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim())
      const head = cells(ln); i += 2
      const body = []
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) body.push(cells(lines[i++]))
      closeList()
      out.push('<table><thead><tr>' + head.map(c => '<th>' + mdInline(c) + '</th>').join('') +
        '</tr></thead><tbody>' +
        body.map(r => '<tr>' + r.map(c => '<td>' + mdInline(c) + '</td>').join('') + '</tr>').join('') +
        '</tbody></table>')
      continue
    }
    const h = /^(#{1,6})\s+(.*)$/.exec(ln)
    if (h){ closeList()
      const lvl = Math.min(h[1].length, 3)
      out.push('<h' + lvl + '>' + mdInline(h[2]) + '</h' + lvl + '>'); i++; continue }
    if (/^(---|\*\*\*|___)\s*$/.test(ln)){ closeList(); out.push('<hr>'); i++; continue }
    const q = /^>\s?(.*)$/.exec(ln)
    if (q){ closeList(); out.push('<blockquote>' + mdInline(q[1]) + '</blockquote>'); i++; continue }
    const ul = /^\s*[-*+]\s+(.*)$/.exec(ln)
    const ol = /^\s*\d+[.)]\s+(.*)$/.exec(ln)
    if (ul || ol){
      const want = ul ? 'ul' : 'ol'
      if (list !== want){ closeList(); out.push('<' + want + '>'); list = want }
      out.push('<li>' + mdInline((ul || ol)[1]) + '</li>'); i++; continue
    }
    if (!ln.trim()){ closeList(); i++; continue }
    closeList()
    const para = [ln]; i++
    while (i < lines.length && lines[i].trim() &&
           !/^(#{1,6}\s|```|>|\s*[-*+]\s|\s*\d+[.)]\s|\s*\|)/.test(lines[i]))
      para.push(lines[i++])
    out.push('<p>' + mdInline(para.join(' ')) + '</p>')
  }
  closeList()
  return out.join('')
}

async function openDoc(skill){
  const r = await api('/skill?path=' + encodeURIComponent(skill.path))
  if (!r?.text){ toast("couldn't open that skill"); return }
  docOpen = skill
  $('docName').textContent  = '/' + skill.name
  const cwd = sessions.find(x => x.id === active)?.cwd || ''
  const loadsHere = skill.scope !== 'project'
    || (skill.dir && (cwd === skill.dir || cwd.startsWith(skill.dir + '/')))
  $('docScope').textContent = skill.scope === 'project' ? skill.project
                            : skill.kind === 'command' ? 'command' : 'global'
  $('docScope').classList.toggle('off', !loadsHere)
  $('docScope').title = loadsHere ? '' : "won't load in this session"
  $('docWarn').hidden = loadsHere
  $('docWarn').textContent = "won't load in this session — it belongs to " + (skill.project || '')
  $('docPath').textContent  = tilde(skill.path)
  $('docBody').innerHTML    = renderMd(r.text)
  $('docBody').scrollTop = 0
  $('doc').hidden = false
  scheduleResize()                      // the terminal keeps working, just narrower
}
function closeDoc(){
  if (!docOpen) return
  docOpen = null; $('doc').hidden = true; scheduleResize(); term.focus()
}
$('docClose').onclick = closeDoc
$('docEdit').onclick = () => {
  if (!docOpen) return
  // no auto-submit: you finish the sentence, same as inserting a skill
  typeIn('Open ' + docOpen.path + ' and ')
  toast('path handed to the session — say what to change')
}

/* ── drag & drop / paste ──────────────────────────────────────────────────
   A browser never hands you a dropped file's real path, so the bytes go to the
   host, which writes them under ~/.oneterm/drops/<date>/ and returns the path.
   We then type that path into the session — the same thing dragging a file into
   Terminal.app does, and exactly what an agent needs to read it. */
const shellQuote = (p) => /^[A-Za-z0-9._\/-]+$/.test(p) ? p : "'" + p.replace(/'/g, "'\\''") + "'"
let dragDepth = 0
function toast(msg, ms = 2600){
  const t = $('droptoast'); t.textContent = msg; t.classList.add('show')
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms)
}
async function sendFiles(files){
  if (!files.length) return
  if (!ws || ws.readyState !== 1){ toast('no session attached'); return }
  const paths = []
  for (const f of files){
    toast(`uploading ${f.name}…`, 60000)
    try {
      const r = await fetch('/drop?name=' + encodeURIComponent(f.name),
        { method: 'POST', body: f })
      const j = await r.json()
      if (j?.path) paths.push(j.path)
      else { toast(j?.error === 'too_large' ? `${f.name} is too large` : `couldn't add ${f.name}`); return }
    } catch { toast(`couldn't add ${f.name}`); return }
  }
  // a trailing space so you can keep typing straight after the path
  typeIn(paths.map(shellQuote).join(' ') + ' ')
  toast(paths.length === 1 ? '1 file added' : paths.length + ' files added')
}
// counter, not a boolean: dragenter/leave fire for every child element
addEventListener('dragenter', e => {
  if (![...(e.dataTransfer?.types || [])].includes('Files')) return
  dragDepth++; document.body.classList.add('dragging-file')
})
addEventListener('dragleave', () => {
  if (--dragDepth <= 0){ dragDepth = 0; document.body.classList.remove('dragging-file') }
})
addEventListener('dragover', e => {
  if (![...(e.dataTransfer?.types || [])].includes('Files')) return
  e.preventDefault()                     // without this the browser navigates to the file
  e.dataTransfer.dropEffect = 'copy'
})
addEventListener('drop', e => {
  if (![...(e.dataTransfer?.types || [])].includes('Files')) return
  e.preventDefault()
  dragDepth = 0; document.body.classList.remove('dragging-file')
  sendFiles([...e.dataTransfer.files])
})
// ⌘V of a screenshot straight from the clipboard, same lane
addEventListener('paste', e => {
  const files = [...(e.clipboardData?.files || [])]
  if (!files.length) return
  e.preventDefault()
  sendFiles(files)
})

/* ── boot ────────────────────────────────────────────────────────────────── */
const hideOverlay = () => { $('overlay').style.display = 'none' }
function firstRun(){
  const o = $('overlay'); o.style.display = 'grid'
  o.innerHTML = '<div><h2>Nothing running</h2>' +
    '<p>Pick a folder and open Claude in it. No cd, no typing.</p>' +
    '<button class="go" id="firstRun">Choose a folder</button></div>'
  $('firstRun').onclick = () => { hideOverlay(); showSheet('new') }
}
;(async () => {
  sendResize()
  const [sk, pr] = await Promise.all([api('/skills'), api('/projects')])
  skills = sk ?? []; projects = pr ?? []
  $('skillCount').textContent = skills.length + ' ⌘J'
  await refresh()
  if (!sessions.length) firstRun()
  else {
    hideOverlay()
    active = active ?? sessions[0].id
    localStorage.setItem('oneterm-active', active)
    paintRail(); connect(active)     // not switchTo(): its same-id guard would bail
  }
  if (window.Notification?.permission === 'default') Notification.requestPermission()
  setInterval(refresh, 1500)
})()
</script>
</body>
</html>
